<?xml version="1.0" encoding="UTF-8"?>
<svg
    xmlns="http://www.w3.org/2000/svg"
    width="900"
    height="500"
    viewBox="0 0 900 500">

    <defs>
        <!-- Дуга для текста -->
        <path
            id="birthdayArc"
            d="M 170 320 A 280 280 0 0 1 730 320"/>

        <!-- Благородное золото для текста и кольца -->
        <linearGradient id="goldGradient" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#FFEFA6" />
            <stop offset="50%" stop-color="#E1B859" />
            <stop offset="100%" stop-color="#9C7323" />
        </linearGradient>

        <!-- Неоновое фиолетовое свечение (Glow) -->
        <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
            <!-- Размытие для создания эффекта свечения заднего плана -->
            <feGaussianBlur stdDeviation="12" result="coloredBlur"/>
            <feMerge>
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>

        <!-- Четкая темная тень для читаемости на светлом фоне -->
        <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="3" dy="4" stdDeviation="2" flood-color="#1A0D2E" flood-opacity="0.8"/>
        </filter>
    </defs>

    <!-- Слой свечения сзади (фиолетовый силуэт всего логотипа) -->
    <g filter="url(#neonGlow)" opacity="0.9">
        <!-- Дублируем кольцо и число фиолетовым цветом для эффекта неона -->
        <circle cx="450" cy="300" r="130" fill="none" stroke="#A882FA" stroke-width="16"/>
        <text x="450" y="330" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-size="150" font-weight="900" fill="#A882FA">24</text>
    </g>

    <!-- Основной слой (Золото с тенью) -->
    <g filter="url(#dropShadow)">
        <!-- Верхний текст -->
        <text
            font-family="'Impact', 'Arial Black', sans-serif"
            font-size="56"
            font-weight="900"
            fill="url(#goldGradient)"
            letter-spacing="6">

            <textPath
                href="#birthdayArc"
                startOffset="50%"
                text-anchor="middle">
                С ДНЁМ РОЖДЕНИЯ!
            </textPath>
        </text>

        <!-- Кольцо -->
        <circle
            cx="450"
            cy="300"
            r="130"
            fill="none"
            stroke="url(#goldGradient)"
            stroke-width="8"/>

        <!-- Число -->
        <text
            x="450"
            y="330"
            text-anchor="middle"
            font-family="'Impact', 'Arial Black', sans-serif"
            font-size="150"
            font-weight="900"
            fill="url(#goldGradient)">
            24
        </text>
    </g>

</svg>
